# Publishes @seamlet/astro to npm: the version in packages/astro/package.json, started by hand from
# the Actions tab on main ("Run workflow"). The repository is checked and built the same way as on
# every pull request first; npm records where the package was built (provenance), which it does
# only for a public repository like this one. A published version is marked with the tag
# `astro-v<version>`, and a version already on npm is never published again.
name: Publish @seamlet/astro

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-astro
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      # Pushes the tag of the published version.
      contents: write
      # Signs the provenance of the package.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: The version is not on npm yet
        id: version
        shell: bash
        run: |
          version=$(node -p 'require("./packages/astro/package.json").version')
          if npm view "@seamlet/astro@$version" version > /dev/null 2>&1; then
            echo "::error::@seamlet/astro@$version is already on npm: raise the version in packages/astro/package.json"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: make check
      - run: npm publish --workspace @seamlet/astro
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Tag the published version
        env:
          TAG: astro-v${{ steps.version.outputs.version }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"
