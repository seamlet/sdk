# Checks on every pull request into main and every push to main: the package is built, then checked
# and used by the test site as an installed package.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: make check

  starter:
    name: Starter template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # A developer gets the template as a project of its own (npm create astro), not inside this
      # repository, whose workspace and tsconfig would be found from within it.
      - name: Copy the template out of the repository
        run: cp -R templates/starter "$RUNNER_TEMP/starter"
      - name: Install, check and build it as a developer would
        working-directory: ${{ runner.temp }}/starter
        run: |
          npm install
          npm run check
          npm run build
